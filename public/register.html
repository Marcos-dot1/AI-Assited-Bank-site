<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Abra sua conta digital gratuita no NovaBanco em poucos minutos. Sem taxas de manutenção.">
  <title>Cadastro — NovaBanco</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container" style="max-width: 520px;">
      <a href="/" class="auth-logo">
        <div class="logo-icon">N</div>
        <span>NovaBanco</span>
      </a>

      <div class="auth-card">
        <h2>Crie sua conta grátis</h2>
        <p class="auth-subtitle">Preencha seus dados e abra sua conta digital em minutos</p>

        <div class="auth-error" id="registerError"></div>

        <form class="auth-form" id="registerForm">
          <div class="form-group">
            <label for="regName">Nome completo</label>
            <input type="text" id="regName" placeholder="Seu nome completo" required minlength="3">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="regEmail">E-mail</label>
              <input type="email" id="regEmail" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
              <label for="regPhone">Telefone</label>
              <input type="tel" id="regPhone" placeholder="(11) 99999-9999" required>
            </div>
          </div>

          <div class="form-group">
            <label for="regCPF">CPF</label>
            <input type="text" id="regCPF" placeholder="000.000.000-00" required maxlength="14">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="regPassword">Senha</label>
              <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
              <label for="regPasswordConfirm">Confirmar Senha</label>
              <input type="password" id="regPasswordConfirm" placeholder="Confirme a senha" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg auth-submit" id="registerSubmitBtn">
            Criar Minha Conta
          </button>
        </form>

        <div class="auth-footer">
          Já tem uma conta? <a href="/login.html">Faça login</a>
        </div>
      </div>

      <div class="auth-disclaimer">
        <p>🔒 <strong>Aviso:</strong> O NovaBanco é um projeto demonstrativo fictício. Qualquer semelhança com a realidade é mera coincidência.</p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/auth.js"></script>
</body>
</html>
